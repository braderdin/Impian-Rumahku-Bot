name: Warmup & Maintain Pipeline Cache

on:
  schedule:
    # Berjalan automatik setiap 5 hari sekali pada jam 12:00 AM UTC (8:00 AM Waktu Malaysia)
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Butang manual trigger di GitHub UI

jobs:
  warmup-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Cache direktori ~/.cache/pip dan ~/.cache/huggingface serentak
      - name: Pulihkan / Simpan Cache Pip & Hugging Face
        id: pipeline-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-ircm-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ircm-cache-

      # Pasang semua pustaka daripada requirements.txt
      - name: Pasang Pustaka Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Muat turun dan kunci model Qwen3.5-4B GGUF & Vision Projector mmproj-F16 (~3.41 GB)
      - name: Pra-Muat Turun Model Qwen3.5-4B (Q4_K_M) & mmproj-F16 GGUF
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          repo_id = 'unsloth/Qwen3.5-4B-GGUF'
          files = ['Qwen3.5-4B-Q4_K_M.gguf', 'mmproj-F16.gguf']
          
          for filename in files:
              print(f'⏳ Mula memuat turun & mengunci: {repo_id}/{filename}')
              path = hf_hub_download(repo_id=repo_id, filename=filename, local_files_only=False)
              print(f'✅ Fail berjaya dimuat turun dan dikunci: {path}')
          "