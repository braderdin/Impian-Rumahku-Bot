name: Test Local Qwen2.5-VL 3B (Q5_K_M) Vision AI

on:
  workflow_dispatch: # Manual trigger sahaja di GitHub UI

jobs:
  test-qwen-vl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Cache Model Qwen2.5-VL Q5_K_M (~2.22 GB) & mmproj (~1.34 GB)
      - name: Pulihkan / Simpan Cache Hugging Face VLM
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-qwen-vl-3b-q5km-v1
          restore-keys: |
            ${{ runner.os }}-hf-qwen-vl-3b-q5km-

      # Cache wheel & pakej pip
      - name: Pulihkan / Simpan Cache Pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-qwen-vl-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-qwen-vl-test-

      - name: Pasang Pustaka & llama-cpp-python (Prebuilt CPU Wheel)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install huggingface-hub python-dotenv requests pillow
          
          # Pasang prebuilt wheel CPU untuk kelajuan maksimum
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Jalankan Ujian Saluran Local Qwen2.5-VL (Q5_K_M)
        env:
          IRCM_SUPABASE_URL: ${{ secrets.IRCM_SUPABASE_URL }}
          IRCM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.IRCM_SUPABASE_SERVICE_ROLE_KEY }}
          IRCM_UPSTASH_REDIS_REST_URL: ${{ secrets.IRCM_UPSTASH_REDIS_REST_URL }}
          IRCM_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.IRCM_UPSTASH_REDIS_REST_TOKEN }}
          IRCM_UPSTASH_VECTOR_REST_URL: ${{ secrets.IRCM_UPSTASH_VECTOR_REST_URL }}
          IRCM_UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.IRCM_UPSTASH_VECTOR_REST_TOKEN }}
          IRCM_TELEGRAM_BOT_TOKEN: ${{ secrets.IRCM_TELEGRAM_BOT_TOKEN }}
          IRCM_TELEGRAM_CHAT_ID: ${{ secrets.IRCM_TELEGRAM_CHAT_ID }}
        run: |
          python experiments/local_llm/test_pipeline_local_qwen_vl.py